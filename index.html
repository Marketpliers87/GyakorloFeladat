<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Italok</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container mt-5">
        <h1>Italok listája</h1>

        <table class="table table-bordered table-striped mt-3">
            <thead class="table-dark">
                <tr>
                    <th>Név</th>
                    <th>Ár</th>
                </tr>
            </thead>
            <tbody id="italok">
            </tbody>
        </table>

        <h2 class="mt-5">Új ital hozzáadása</h2>

        <form id="italForm" class="mt-3">
            <div class="mb-3">
                <label for="nev" class="form-label">Ital neve</label>
                <input type="text" id="nev" class="form-control">
            </div>

            <div class="mb-3">
                <label for="ar" class="form-label">Ital ára</label>
                <input type="number" id="ar" class="form-control">
            </div>

            <button type="submit" class="btn btn-primary">Felvétel</button>
        </form>

        <p id="hiba" class="text-danger mt-3"></p>
        <p id="siker" class="text-success mt-3"></p>
    </div>

    <script src="main.js"></script>
</body>
</html>
